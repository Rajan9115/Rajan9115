
name: Update GitHub Streak Stats

on:
  schedule:
    # Every day at 5:30 AM IST
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/streak-stats.yml"

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: >-
            user=Rajan9115
            &theme=tokyonight
            &timezone=Asia/Kolkata
            &hide_border=true
          path: profile/streak.svg

      - name: Commit updated streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/streak.svg

          if git diff --cached --quiet; then
            echo "No changes in streak stats."
            exit 0
          fi

          git commit -m "chore: update GitHub streak stats"
          git push
